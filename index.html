<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Serpent's Oath · Free pixel-art adventure in ancient Greece</title>
<meta name="description" content="The Serpent's Oath: a free open-world pixel-art adventure through ancient Greece, from the Aegean coast down to the underworld. Windows and Mac. Hebrew, English and Spanish.">
<meta name="theme-color" content="#140b11">
<meta property="og:title" content="The Serpent's Oath">
<meta property="og:description" content="Val's journey to bring Roye home. A free open-world adventure through ancient Greece: a story campaign and an online world.">
<meta property="og:image" content="https://serpents-oath.github.io/assets/logo/og-image.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logo/medusa.ico?v=37" sizes="any"><link rel="icon" href="assets/logo/medusa-32.png?v=37" sizes="32x32"><link rel="icon" href="assets/logo/icon-512.png?v=37" sizes="512x512">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-180.png?v=37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Marcellus&family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="flow.css?v=r3c">
</head>
<body>
<!-- ============ top bar ============ -->
<!-- the scroll companion: a serpent of gold light behind the page -->
<div class="serp" id="serp" aria-hidden="true"><svg id="serp-svg"><path id="serp-path" fill="none"/></svg><i class="serp-glow" id="serp-glow"></i></div>

<header class="bar" id="bar">
  <div class="bar-in">
    <a class="brand" href="#top" aria-label="The Serpent's Oath"><img class="lt" data-src="logotype_bar" alt="The Serpent's Oath"></a>
    <nav id="mainnav">
      <a href="#game" data-n="nav_game"></a>
      <a href="#heroes" data-n="nav_lb"></a>
      <a href="#updates" data-n="nav_upd"></a>
      <a href="wiki.html" data-n="nav_wiki"></a>
      <a href="companion.html" data-n="nav_comp"></a>
      <a href="forum.html" data-n="nav_forum"></a>
      <div class="navlang" role="group" aria-label="Language"><button type="button" class="lopt" data-l="he" lang="he">עברית</button><button type="button" class="lopt" data-l="en" lang="en">English</button><button type="button" class="lopt" data-l="es" lang="es">Español</button></div>
    </nav>
    <div class="bar-r">
      <a href="account.html" class="who" id="who" data-nav="acct"></a>
      <a href="account.html?next=download" class="playnav" data-x="play"></a>
    <div class="langw">
      <button class="langbtn" id="lang" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu" aria-label="Language"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.4" ry="8"/><path d="M2 10h16M3.4 5.6h13.2M3.4 14.4h13.2"/></svg><span id="lang-cur"></span><i aria-hidden="true"></i></button>
      <div class="lmenu" id="lang-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" class="lopt" data-l="he" lang="he">עברית</button>
        <button type="button" role="menuitemradio" class="lopt" data-l="en" lang="en">English</button>
        <button type="button" role="menuitemradio" class="lopt" data-l="es" lang="es">Español</button>
      </div>
    </div>
      <button class="navtg" id="navtg" type="button" aria-expanded="false" aria-controls="mainnav" aria-label="Menu"><i aria-hidden="true"></i></button>
    </div>
  </div>
</header>

<!-- ============ hero ============ -->
<section class="hero" id="top">
  <div class="hero-scene" aria-hidden="true"><div class="im" data-bg="hero" data-slot="hero-loop"></div></div>
  <div class="hero-shade" aria-hidden="true"></div>
  <div class="hero-in wrap">
    <div class="hero-col">
      <h1 class="logo"><img data-src="logo_full" alt="The Serpent's Oath" width="900" height="673"><i class="eye e1" aria-hidden="true"></i><i class="eye e2" aria-hidden="true"></i><i class="glint" id="glint" aria-hidden="true"></i></h1>
      <p class="tag" data-t="tagline"></p>
      <div class="dl" data-dl>
        <button type="button" class="btn dlbtn playbtn"><img class="px" data-src="pi-sword" alt="" width="24" height="24"><span class="lbl"><span data-x="play"></span><small class="dl-plat ltr"></small></span></button>
        <p class="dl-other"></p>
      </div>
      <p class="meta"><span id="meta"></span><button type="button" class="trailer-btn" id="trailer-btn"><i aria-hidden="true"></i><span data-t="trailer"></span></button></p>
      <p class="req" data-h="req"></p>
    </div>
  </div>
  <audio id="hero-audio" loop preload="none" src="assets/trailer.ogg"></audio>
  <button type="button" class="snd-btn" id="hero-snd" hidden aria-pressed="false" data-ta="snd_on"><svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="on" d="M11 5a4 4 0 0 1 0 6M12.5 3a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4"/><path class="off" d="M10.5 6l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
</section>

<main>
  <!-- ============ download and play ============ -->
  <section class="run" id="run" aria-labelledby="run-h">
    <div class="wrap">
      <h2 class="h2" id="run-h" data-t="run_h"></h2>
      <p class="lead" data-t="run_sub"></p>
      <aside class="ad a-run wide-only" data-ad="frog"></aside>
      <ol class="steps">
        <li class="step"><b class="num" aria-hidden="true">1</b><h3 data-t="s1_h"></h3><p data-h="s1_p"></p></li>
        <li class="step"><b class="num" aria-hidden="true">2</b><h3 data-t="s2_h"></h3><p data-h="s2_p"></p></li>
        <li class="step"><b class="num" aria-hidden="true">3</b><h3 data-t="s3_h"></h3><p data-h="s3_p"></p></li>
      </ol>
      <div class="notes">
        <h3 data-t="notes_h"></h3>
        <div>
          <details class="acc"><summary data-t="n_ss_h"></summary><div class="body"><p data-h="n_ss"></p></div></details>
          <details class="acc"><summary data-t="n_mac_h"></summary><div class="body"><p data-h="mac_p"></p></div></details>
          <details class="acc"><summary data-t="n_upd_h"></summary><div class="body"><p data-h="n_upd"></p></div></details>
          <details class="acc"><summary data-t="n_req_h"></summary><div class="body"><p data-h="n_req"></p><p data-h="n_save"></p><p data-h="n_full"></p></div></details>
          <details class="acc"><summary data-t="n_online_h"></summary><div class="body"><p data-h="bo_p"></p></div></details>
        </div>
      </div>
    </div>
  </section>
  
  <!-- ============ the game ============ -->
  <section class="game" id="game" aria-labelledby="game-h">
    <div class="wrap">
      <h2 class="h2" id="game-h" data-t="about_h"></h2>
      <p class="story" data-t="about_p1"></p>
    </div>
    <div class="drift"><aside class="ad" data-ad="wolf"></aside></div>
    <div class="stage" data-stage>
      <div class="stage-media" aria-hidden="true">
        <figure data-k="fight" class="on"><div class="im wide" data-bg="fight" data-slot="combat"></div></figure>
      </div>
      <div class="chapters wrap">
        <article class="chap" data-k="fight">
          <div class="chap-im" data-bg="fight"></div>
          <img class="ic px" data-src="pi-sword" alt="" width="48" height="48">
          <h3 data-t="f_fight_h"></h3><p data-t="f_fight_p"></p>
          <details class="more"><summary data-t="f_fight_m"></summary><p data-h="f_fight_x"></p></details>
        </article>
      </div>
    </div>

    <div class="drift"><aside class="ad" data-ad="skeleton"></aside></div>

    <!-- the world: the map is the scene -->
    <div class="mapscene" id="mapscene">
      <div class="map-stick">
        <div class="map-back" data-bg="world" aria-hidden="true"></div>
        <div class="mapbox" id="mapwrap">
          <div class="grey" data-bg="world"></div><canvas id="mapc"></canvas>
          <div class="rift" id="rift" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="marks" id="marks" aria-hidden="true"></div>
        </div>
        <div class="map-shade" id="map-shade" aria-hidden="true"></div>
        <article class="map-left" data-k="ride">
          <img class="ic px" data-src="pi-horse" alt="" width="48" height="48">
          <h3 data-t="f_ride_h"></h3><p data-t="f_ride_p"></p>
          <details class="more"><summary data-t="f_ride_m"></summary><p data-h="f_ride_x"></p></details>
        </article>
        <ul class="map-right" id="map-right"><li data-x="map_1"></li><li data-x="map_2"></li><li data-x="map_3"></li></ul>
        <figure class="tart" id="tart"><div class="im" data-bg="tart" data-slot="tartarus" role="img" aria-label="Tartarus"></div><i class="rim" aria-hidden="true"></i><figcaption><b class="ltr">TARTARUS</b><span data-x="tart_sub"></span></figcaption></figure>
        <span class="maphint" id="maphint"></span>
      </div>
    </div>

    <div class="drift"><aside class="ad" data-ad="crab"></aside></div>
    <div class="stage" data-stage>
      <div class="stage-media" aria-hidden="true">
        <figure data-k="story" class="on"><div class="im" data-bg="story" style="image-rendering:auto"></div></figure>
        <figure data-k="inv"><div class="im dim" data-bg="night"></div><img class="win" data-src="gear" alt=""></figure>
        <div class="ticks"><i class="on"></i><i></i></div>
      </div>
      <div class="chapters wrap">
        <article class="chap" data-k="story">
          <div class="chap-im" data-bg="story" style="image-rendering:auto"></div>
          <img class="ic px" data-src="pi-scroll" alt="" width="48" height="48">
          <h3 data-t="f_story_h"></h3><p data-t="f_story_p"></p>
          <details class="more"><summary data-t="f_story_m"></summary><p data-h="f_story_x"></p></details>
        </article>
        <div class="drift" data-side="l"><aside class="ad" data-ad="boar"></aside></div>
        <article class="chap" data-k="inv">
          <div class="chap-im contain" data-bg="gear" style="image-rendering:auto"></div>
          <img class="ic px" data-src="pi-compass" alt="" width="48" height="48">
          <h3 data-t="f_inv_h"></h3><p data-t="f_inv_p"></p>
          <details class="more"><summary data-t="f_inv_m"></summary><p data-h="f_inv_x"></p></details>
        </article>
      </div>
    </div>
    <p class="wikiline wrap"><a class="btn line" href="wiki.html"><img data-src="pi-scroll" alt="" class="px"><span data-t="wiki_cta"></span></a></p>
    <div class="drift"><aside class="ad" data-ad="satyr"></aside></div>
  </section>

  <!-- ============ companion: a preview only; the Companion page keeps the app itself ============ -->
  <section class="comp" id="companion" aria-labelledby="comp-h">
    <div class="wrap comp-grid">
      <div class="comp-tx">
        <p class="comp-tag"><img class="px" data-src="pi-horse" alt="" width="24" height="24"><span data-x="comp_tag"></span></p>
        <h2 class="h2" id="comp-h" data-x="comp_h"></h2>
        <p class="lead" data-x="comp_p"></p>
        <p class="comp-p2" data-x="comp_p2"></p>
        <p class="comp-go"><a class="btn" href="companion.html" data-x="comp_go"></a></p>
      </div>
      <div class="comp-ph" id="comp-ph">
        <figure class="phone p1"><img data-comp="comp-village" alt="" width="400" height="866"></figure>
        <figure class="phone p2"><img data-comp="comp-tasks" alt="" width="400" height="866"></figure>
      </div>
    </div>
  </section>

  <!-- ============ screenshots ============ -->
  <section class="shots" id="shots" aria-labelledby="shots-h">
    <div class="pin" id="pin">
      <div class="pin-stick">
        <div class="wrap" style="width:100%"><h2 class="h2" id="shots-h" data-t="shots_h"></h2></div>
        <div class="film-scroll"><div class="film" id="film"></div></div>
      </div>
    </div>
  </section>

  <!-- ============ hall of fame ============ -->
  <section class="hall" id="heroes" aria-labelledby="lb-h">
    <div class="wrap">
      <h2 class="h2" id="lb-h" data-t="lb_h"></h2>
      <p class="lead" data-t="lb_sub"></p>
      <aside class="ad a-hall wide-only" data-ad="asterion"></aside>
      <div id="lb"></div>
    </div>
  </section>

  <!-- ============ updates ============ -->
  <section class="upd" id="updates" aria-labelledby="upd-h">
    <div class="wrap upd-grid">
      <div class="upd-head">
        <h2 class="h2" id="upd-h" data-t="upd_h"></h2>
        <p class="lead" id="upd-sub"></p>
        <div class="revs wide-only"><aside class="ad" data-ad="bear" style="--r:-2deg"></aside><aside class="ad" data-ad="talos" style="--r:1.5deg"></aside><aside class="ad" data-ad="polyphemos" style="--r:-1deg"></aside></div>
      </div>
      <div>
        <div class="log" id="log"></div>
        <p class="more-row"><button type="button" class="btn line" id="upd-more"><span data-t="upd_more"></span></button></p>
        <aside class="ad a-kampe" data-ad="kampe"></aside>
      </div>
    </div>
  </section>

  <!-- ============ HERCULES: the game's own anti-cheat ============ -->
  <section class="herc" id="hercules" aria-labelledby="herc-h">
    <div class="wrap herc-grid">
      <img class="herc-logo" data-src="hercules" alt="HERCULES Anti-Cheat" width="480" height="320">
      <div>
        <h2 class="h2" id="herc-h"><span class="ltr">HERCULES</span> <small class="ltr">Anti-Cheat</small></h2>
        <p class="lead" data-x="herc_p"></p>
        <ul class="herc-li"><li data-x="herc_1"></li><li data-x="herc_2"></li><li data-x="herc_3"></li></ul>
        <p class="herc-more"><a href="privacy.html" data-x="herc_go"></a></p>
      </div>
    </div>
  </section>

  <!-- ============ community ============ -->
  <section class="com-sec" id="community" aria-labelledby="com-h">
    <div class="wrap">
      <h2 class="h2" id="com-h" data-t="com_h"></h2>
      <aside class="ad a-com" data-ad="gorgon"></aside>
      <div class="com">
        <a class="comrow" href="forum.html"><img data-src="pi-gstar" alt="" class="px"><h3 data-t="com_forum_h"></h3><p data-t="com_forum_p"></p><i class="go" aria-hidden="true"></i></a>
        <a class="comrow" href="wiki.html"><img data-src="pi-scroll" alt="" class="px"><h3 data-t="com_wiki_h"></h3><p data-t="com_wiki_p"></p><i class="go" aria-hidden="true"></i></a>
        <a class="comrow" href="companion.html"><img data-src="pi-horse" alt="" class="px"><h3 data-t="com_comp_h"></h3><p data-t="com_comp_p"></p><i class="go" aria-hidden="true"></i></a>
        <a class="comrow" href="account.html"><img data-src="pi-compass" alt="" class="px"><h3 data-t="com_acc_h"></h3><p data-t="com_acc_p"></p><i class="go" aria-hidden="true"></i></a>
      </div>
    </div>
  </section>

  <!-- ============ last call ============ -->
  <section class="cta" aria-labelledby="cta-h">
    <div class="im" data-bg="fight2" data-slot="last-call" aria-hidden="true"></div>
    <div class="wrap">
      <img class="emb" data-src="emblem" alt="">
      <h2 id="cta-h" data-t="cta_h"></h2>
      <p class="oath" aria-hidden="true"></p>
      <div class="dl" data-dl>
        <button type="button" class="btn dlbtn playbtn"><img class="px" data-src="pi-sword" alt="" width="24" height="24"><span class="lbl"><span data-x="play"></span><small class="dl-plat ltr"></small></span></button>
        <p class="dl-other"></p>
      </div>
    </div>
  </section>
</main>

<footer class="sitefoot" id="foot"></footer>

<!-- the essential-cookies note -->
<aside class="cookie" id="cookie" aria-live="polite"><p id="cookie-t"></p><button type="button" id="cookie-x" aria-label="Close">×</button></aside>

<!-- the step after "Play for free" when nobody is signed in (mock: no real sign-in, no real download) -->
<dialog id="join" class="join" aria-labelledby="join-h">
  <button type="button" class="vclose" id="join-x" aria-label="Close">×</button>
  <img data-src="logotype" alt="" class="join-logo">
  <h2 id="join-h" data-x="join_h"></h2>
  <p data-x="join_p"></p>
  <div class="join-row"><a class="btn" href="account.html?next=download" data-x="join_in"></a><a class="btn stone" href="account.html?next=download&amp;mode=register" data-x="join_up"></a></div>
  <p class="join-then" data-x="join_then"></p>
  <a class="join-skip" href="#" id="join-skip"><span data-x="join_skip"></span><small class="dl-plat ltr"></small></a>
</dialog>

<!-- trailer and screenshot viewer -->
<dialog id="viewer" class="viewer" aria-label="Viewer">
  <button type="button" class="vclose" id="vclose" aria-label="Close">×</button>
  <div class="vbody" id="vbody"></div>
</dialog>

<script src="updates.js?v=r3c"></script>
<script src="home.js?v=r3c"></script>
<script src="nav-auth.js?v=r3c"></script>
</body>
</html>
